services:
  app:
    build: docker/php
    # storage:link publica as fotos (public/storage); sem ele o upload funciona mas a imagem não aparece.
    command: sh -c "[ -f vendor/autoload.php ] || composer install; php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      # O servidor embutido atende uma requisição por vez; com workers a tela não trava esperando a outra.
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - .:/var/www
      # vendor/ num volume do Docker: pelo bind mount do Windows/OneDrive cada requisição levava dezenas de segundos.
      - vendor:/var/www/vendor
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Roda o comando diário que completa a agenda gerada pelas matrículas.
  scheduler:
    build: docker/php
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan schedule:work"
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor
    depends_on:
      - db
      - app

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: psystem
      POSTGRES_USER: psystem
      POSTGRES_PASSWORD: psystem
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 no host para não brigar com um Postgres instalado na máquina; os containers usam db:5432.
      - "5433:5432"

  # Caixa de entrada de teste: pega todos os e-mails do sistema sem enviar para fora.
  # Veja os e-mails em http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
  vendor:
