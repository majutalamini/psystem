services:
  app:
    build: docker/php
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Roda o comando diário que completa a agenda gerada pelas matrículas.
  scheduler:
    build: docker/php
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    depends_on:
      - db

  node:
    image: node:24
    working_dir: /var/www
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: psystem
      POSTGRES_USER: psystem
      POSTGRES_PASSWORD: psystem
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 no host para não brigar com um Postgres instalado na máquina; os containers usam db:5432.
      - "5433:5432"

  # Caixa de entrada de teste: pega todos os e-mails do sistema sem enviar para fora.
  # Veja os e-mails em http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
